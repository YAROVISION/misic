<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <!-- Outer Neon Glow Filter -->
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <!-- Radial Gradient for Neon Dot -->
        <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#67e8f9"/>
            <stop offset="75%" stop-color="#00f0ff"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </radialGradient>
        <!-- Outer Aura Glow Gradient -->
        <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75"/>
            <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <!-- Soft Outer Neon Aura -->
    <circle cx="32" cy="32" r="30" fill="url(#auraGrad)"/>
    <!-- Intense Glow -->
    <circle cx="32" cy="32" r="16" fill="#00f0ff" filter="url(#neonGlow)" opacity="0.95"/>
    <!-- Core Bright Dot -->
    <circle cx="32" cy="32" r="14" fill="url(#dotGrad)"/>
    <!-- Specular Highlight -->
    <circle cx="27" cy="27" r="4.5" fill="#ffffff" opacity="0.95"/>
</svg>
